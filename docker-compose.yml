name: ecopulse-ai

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECRET_KEY: ${SECRET_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: postgres-timescaledb-vector
  POSTGRES_PORT: "5432"
  REDIS_URL: ${REDIS_URL:-redis://redis-broker:6379/0}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
  OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
  CPCB_API_KEY: ${CPCB_API_KEY:-}
  STATIONS_JSON: ${STATIONS_JSON:-}
  API_KEYS: ${API_KEYS:-}
  AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
  MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
  MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
  ARTIFACTS_DIR: /app/artifacts

services:
  postgres-timescaledb-vector:
    image: timescale/timescaledb-ha:pg16   # ships TimescaleDB + pgvector
    container_name: ecopulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [data-net]

  redis-broker:
    image: redis:7-alpine
    container_name: ecopulse-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [data-net]

  fastapi-backend:
    build:
      context: ./backend
    container_name: ecopulse-api
    restart: unless-stopped
    environment: *backend-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    volumes:
      - ml-artifacts:/app/artifacts
      - hf-cache:/root/.cache/huggingface
    depends_on:
      postgres-timescaledb-vector:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [data-net, app-net]

  celery-worker:
    build:
      context: ./backend
    container_name: ecopulse-worker
    restart: unless-stopped
    environment: *backend-env
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "-B", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - ml-artifacts:/app/artifacts
      - hf-cache:/root/.cache/huggingface
    depends_on:
      postgres-timescaledb-vector:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [data-net]

  nextjs-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws/live-metrics}
    container_name: ecopulse-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      fastapi-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app-net]

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: ecopulse-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      fastapi-backend:
        condition: service_healthy
      nextjs-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app-net]

  mcp-server:   # Model Context Protocol server: lets any MCP client (Claude, IDE agents) query EcoPulse. Start: make mcp
    build:
      context: ./backend
    profiles: ["mcp"]
    container_name: ecopulse-mcp
    restart: unless-stopped
    environment: *backend-env
    command: ["python", "-m", "app.mcp_server"]
    ports:
      - "127.0.0.1:8765:8765"   # localhost only: no auth yet
    volumes:
      - hf-cache:/root/.cache/huggingface
    depends_on:
      postgres-timescaledb-vector:
        condition: service_healthy
    networks: [data-net]

  prometheus:   # Start: make observability
    image: prom/prometheus:v2.55.0
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [app-net]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me-now}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [app-net]

  mlflow:   # experiment tracking UI. Start: make mlflow, then set MLFLOW_TRACKING_URI=http://mlflow:5000 in .env and restart
    image: ghcr.io/mlflow/mlflow:v2.17.2
    profiles: ["mlops"]
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
      --default-artifact-root mlflow-artifacts:/
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    networks: [data-net, app-net]

networks:
  data-net:
  app-net:

volumes:
  pgdata:
  redisdata:
  ml-artifacts:
  hf-cache:
  mlflow-data:
